# AstraWeave release-pack manifest — consumed by `cargo xtask fetch-assets` (AD.5
# transactional original-path restore; supersedes the AD.2/AD.3 assets/packs/ model).
#
# Each [[pack]] entry is one independently fetchable, independently verifiable zip
# whose members are FULL REPO-RELATIVE PATHS restored to their original locations:
#   name       unique pack id (also the state key under assets/.pack-state/)
#   source     https:// URL (GitHub release asset), file:// URL, or plain local path.
#              Local sources let packs be verified end-to-end BEFORE upload and let
#              the director sideload if quota problems recur.
#   sha256     lowercase hex sha256 of the zip — THE PACK VERSION ANCHOR. A changed
#              pin IS a new pack version (installer replaces pack-managed files and
#              prunes ones absent from the new version); an equal pin with a valid
#              stamp is a no-op. There is no separate version field by design.
#   size_bytes expected zip size — progress/sanity only, sha256 is the gate
#   roots      COARSE managed-path coverage (trailing / = directory, else exact file).
#              Feeds the generated ignore surfaces (`cargo xtask gen-ignore`) and the
#              git rails. Containers may be shared between packs and with tracked
#              sample/retained cohabitants — FILE-exact ownership lives in the
#              committed packlists (assets/packlists/<name>.txt == the zip's
#              _PACK_MANIFEST.txt; enforced at install step 5 and by ci-guard).
#
# Ignore surfaces: assets/.gitignore is fully generated; roots outside assets/
# (materials-src at assets_src/) live in the AW-PACK-IGNORE block of the root
# .gitignore. Cohabitant keeplist: assets/packlists/_tracked_keep.txt (subset
# semantics; `cargo xtask gen-keeplist`).
#
# SPLIT-PACK RULE: GitHub caps release files at 2 GB. A pack exceeding that is split
# at directory boundaries into independent zips, each with its own [[pack]] entry —
# there is deliberately no multi-part reassembly logic (each entry stands alone and
# is retryable on its own).
#
# G-3 AMENDMENT (ratified 2026-07-06, AD.1.C): several pack sources are LOOSE-FILE
# directories with no subdirectory structure to split on (e.g. textures-environment,
# textures-pine-forest, the Namaqualand/verdant meshes). For those, split at
# name-prefix (slug-family) boundaries instead of directory boundaries: all files of
# one slug/family stay in the same zip (they are never straddled across zips), each
# zip remains independently verifiable, and there is still no reassembly step. A zip
# is thus a whole number of slug-families, never a fraction of one.
#
# TRACE/MATCHING STANDARD (ratified 2026-07-06, AD.1.C; binds future trace beats):
# a family is TRACED only under the AD.1 standard — an API-verified upstream slug
# (Poly Haven / ambientCG) + that site's CC0, an in-pack LICENSE, SHA-256 byte-twin
# to a licensed copy, or an in-repo deterministic generator (first-party). Name-link
# admissibility: a TRAILING-NUMERAL variant is admissible (forrest_ground_01 /
# moss_01); a WORD-SUBSTITUTION is NOT (pine_trunk). Anything untraceable is
# quarantine — never packed, never uploaded.
#
# State: assets/.pack-state/ (stamps, ledgers, journals, staging; gitignored).
# A run whose stamp sha256 matches the manifest is an announced no-op; --force or
# --repair restores the current version to pristine. Unknown preexisting files at
# exact destinations fail the install unless --adopt.

schema_version = 2

# [profiles] — named pack selections. The DEFAULT invocation fetches `starter`;
# `--all` (or the wildcard `all` profile) fetches everything. AD.6 Tier 2 uses --all.
#
# STARTER MEMBERSHIP (proposal, director ratifies at the AD.5 gate; veto = edit this
# list): the new-contributor first-ten-minutes set, biased small (~542 MiB of the
# 15.4 GiB total). Consumer evidence per pack:
#   hdri-catalog    (45.0 MiB) — hdri_catalog.rs/biome_material.rs parse
#                    assets/hdri/hdri_catalog.toml and resolve its biome/time-of-day
#                    HDRI matrix from this pack's files.
#   kenney-audio    (23.8 MiB) — audio_bridge.rs scans assets/audio at editor
#                    startup; without it the Audio panel is silent.
#   kaykit-complete (473.0 MiB) — entity_panel.rs default_mesh() hardcodes KayKit
#                    paths for every archetype; entity_catalog.rs's first scan
#                    target. Without it "Add Entity" shows placeholders.
# Notable exclusions: road-to-vostok (1.0 GiB, on-demand catalog only),
# models-props (599 MiB, no net-new consumer), scene-* (7.7 GiB, biome-gated),
# textures-environment-a/b/c (3.4 GiB, no live consumer found),
# textures-pine-forest (1.5 GiB, consumer is a pre-existing broken path — see
# AD5_RECONNECTION_OUTCOME.md), kenney-3d/2d-ui (browser fodder), materials-src
# (archival sources).
[profiles]
starter = ["hdri-catalog", "kenney-audio", "kaykit-complete"]
all = ["*"]

